services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodbridge
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - foodbridge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge -d foodbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://foodbridge:${POSTGRES_PASSWORD:-local-development-only}@db:5432/foodbridge
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret}
      CORS_ORIGINS: http://localhost:5173
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  foodbridge-postgres:
